<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HYL's Studio</title>
<style>
:root{--bg:#0f1330;--panel:#181e4a;--panel2:#1f2760;--line:#2d3778;--text:#e9ecf9;--muted:#98a2d0;--gold:#f8c880;--blue:#5a78d6;--red:#e94d52;--ok:#5ad19a;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--gold)}
header.top{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:#0c1029;position:sticky;top:0;z-index:20}
header.top .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;cursor:pointer;color:#fff;text-decoration:none}
header.top img{height:34px}
header.top .crumb{color:var(--muted)}
.spacer{flex:1}
main{max-width:1500px;margin:0 auto;padding:22px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px;color:var(--gold)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--gold)}
button.primary,.btn.primary{background:var(--gold);color:#1a1f47;border-color:var(--gold);font-weight:700}
button.danger{border-color:#7a2b39;color:#ff9aa1}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:4px 9px;font-size:13px}
input,select,textarea{background:#0f1436;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;width:100%}
input[type=checkbox]{width:auto}input[type=color]{padding:0;height:32px;width:46px}
input[type=number]{width:96px}
label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:#111749}
.chip.done{border-color:var(--ok);color:var(--ok)}.chip.todo{border-color:var(--gold);color:var(--gold)}.chip.bad{border-color:var(--red);color:#ff9aa1}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;cursor:pointer;background:#131a45}
.drop.over{border-color:var(--gold);background:#1d2660}
.bar{height:8px;background:#0c1029;border-radius:99px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--gold);width:0}
.pcard{cursor:pointer;overflow:hidden;padding:0}
.pcard img{width:100%;aspect-ratio:9/12;object-fit:cover;display:block;background:#0c1029}
.pcard .pb{padding:10px 12px}
.pcard:hover{border-color:var(--gold)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 18px;flex-wrap:wrap}
.tabs a{padding:9px 15px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;font-weight:600}
.tabs a.on{color:var(--gold);border-color:var(--gold)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.step{padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.step.done{color:var(--ok);border-color:var(--ok)}.step.now{color:#1a1f47;background:var(--gold);border-color:var(--gold);font-weight:700}
video{width:100%;background:#000;border-radius:10px;display:block}
.phone{max-width:340px}
.tl{display:flex;gap:2px;height:52px;margin:10px 0}
.seg{min-width:22px;border-radius:6px;background:#3a4a9a;cursor:pointer;position:relative;overflow:hidden;font-size:10.5px;padding:3px 4px;line-height:1.15;border:2px solid transparent;color:#fff}
.seg.hook,.seg.outro{background:#6a4fb0}.seg.reps{background:#2f8f6b}.seg.talk{background:#3a55b8}
.seg.sel{border-color:var(--gold)}.seg.dirty::after{content:"";position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.seg .fzmark{position:absolute;left:0;bottom:0;right:0;height:5px;background:var(--gold)}
.list .li{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;background:#141a45}
.list .li.sel{border-color:var(--gold);background:#1d2660}
.list .li .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.words{max-height:340px;overflow:auto;line-height:1.9;padding:10px;background:#0f1436;border-radius:10px;border:1px solid var(--line)}
.words span{cursor:pointer;padding:1px 2px;border-radius:4px}
.words span:hover{background:#2b3680}.words span.cur{background:var(--gold);color:#1a1f47}
.words span.insel{background:#3a55b8}.words span.hit{outline:1px solid var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.modal{position:fixed;inset:0;background:rgba(5,8,25,.82);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:26px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:1100px;width:100%}
.fzstage{position:relative;width:378px;flex:none;user-select:none}
.fzstage img{width:100%;display:block;border-radius:8px;background:#000}
.h{position:absolute;transform:translate(-50%,-50%);cursor:grab;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.h.c{width:28px;height:28px;border-radius:50%;background:var(--gold)}
.h.l{width:44px;height:26px;border-radius:6px;background:var(--blue)}
.h.r{width:18px;height:18px;background:#fff;border-radius:3px}
.h.s{width:44px;height:26px;border-radius:6px;background:var(--red)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99}
#toast div{background:rgba(29,29,31,.94);color:#f5f5f7;border:0;padding:10px 18px;border-radius:980px;box-shadow:0 10px 34px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#toast div.err{background:rgba(120,20,30,.95)}
#toast div.err{border-color:var(--red)}
pre.log{background:#0a0e26;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:190px;overflow:auto;font-size:12px;color:#b8c2ee;white-space:pre-wrap}
.savepill{font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.savepill.ok{color:var(--ok);border-color:var(--ok)}.savepill.err{color:#ff9aa1;border-color:var(--red)}.savepill.sav{color:var(--gold);border-color:var(--gold)}
.md h2,.md h3{margin:14px 0 6px}.md ul{margin:6px 0 6px 20px;padding:0}.md p{margin:6px 0}

.edgrid{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start}
@media(max-width:900px){.edgrid{grid-template-columns:1fr}}
.tlbox{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b0f2c;margin-top:14px}
.tllabels{width:84px;flex:none;background:#0d1233;border-right:1px solid var(--line)}
.tllabels .lab{display:flex;align-items:center;padding:0 8px;font-size:12px;color:var(--muted);border-bottom:1px solid #1a2260}
.tlscroll{flex:1;overflow-x:auto;position:relative}
.tlinner{position:relative;min-height:190px}
.ruler{height:24px;position:relative;cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
.ruler i{position:absolute;top:0;bottom:0;border-left:1px solid #3a4590;font-size:10px;color:var(--muted);padding-left:3px;font-style:normal;pointer-events:none}
.trk{position:relative;border-bottom:1px solid #1a2260}
.trk.vid{height:64px}.trk.voice{height:40px}.trk.aud{height:40px}.trk.txt{height:26px}.trk.vt{height:40px}
.clip.vt{background:#8a4fb0}
.trk.voice canvas{position:absolute;left:0;top:2px;height:36px;pointer-events:none}
.trk .mute{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(233,77,82,.35),rgba(233,77,82,.35) 6px,rgba(0,0,0,.4) 6px,rgba(0,0,0,.4) 12px);font-size:10px;color:#fff;padding:2px 4px;pointer-events:none;overflow:hidden}
.trk .mute.gain{background:rgba(248,200,128,.22);color:var(--gold)}
.clip{position:absolute;top:3px;bottom:3px;border-radius:6px;overflow:hidden;font-size:11px;color:#fff;padding:3px 8px;cursor:grab;user-select:none;border:2px solid transparent;white-space:nowrap;touch-action:none}
.clip span{position:relative;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
.clip.sel{border-color:var(--gold)}.clip.off{opacity:.4}
.clip.v.talk{background:#3a55b8}.clip.v.reps{background:#2f8f6b}.clip.v.clip{background:#0f8ea5}.clip.v.hook,.clip.v.outro{background:#6a4fb0}
.clip.v.dirty::after{content:"";position:absolute;right:9px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--gold);z-index:4}
.clip .fzm{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}
.clip.a .hl,.clip.a .hr{width:min(8px,26%)}
.clip .hl,.clip .hr{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.3);z-index:3}
.clip .hl{left:0}.clip .hr{right:0}
.clip canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.clip.t{top:2px;bottom:2px;cursor:pointer;font-size:10.5px;padding:2px 6px;background:#4b3a8a}
.clip.t.fz{background:#8a6a1f}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:8;box-shadow:0 0 6px rgba(255,255,255,.7)}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#fff}
.rst{font-size:11px;color:var(--gold);text-decoration:none;border:1px solid var(--gold);border-radius:99px;padding:0 7px;margin-left:6px;white-space:nowrap;font-weight:600;background:#241f3a}
.rst:hover{background:var(--gold);color:#1a1f47}
.clip.v{background:#151b47;padding:0;border-bottom:3px solid #5a78d6}
.clip.v.reps{border-bottom-color:#2f8f6b}.clip.v.clip{border-bottom-color:#0f8ea5}.clip.v.hook,.clip.v.outro{border-bottom-color:#8a6fd6;background:#2a2470}
.clip .frames{position:absolute;inset:0;display:flex;pointer-events:none}
.clip .frames img{height:100%;object-fit:cover;display:block;flex:none;opacity:.92}
.clip .lbl{position:absolute;left:8px;top:3px;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;background:rgba(8,12,38,.72);border-radius:4px;padding:0 5px;font-size:10.5px;z-index:2}
.clip.v .hl,.clip.v .hr{background:rgba(248,200,128,.55)}
#assistfab{position:fixed;right:18px;bottom:18px;z-index:40;background:var(--gold);color:#1a1f47;border:0;border-radius:99px;padding:11px 18px;font-weight:800;box-shadow:0 8px 26px rgba(0,0,0,.5);cursor:pointer}
body.assist-open #assistfab{display:none}
#assist{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:100vw;background:#0c1029;border-left:1px solid var(--line);z-index:45;display:none;flex-direction:column}
#assist.open{display:flex}body.assist-open main{padding-right:410px}
#assist .ah{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#amsgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#achips{padding:0 14px;display:flex;flex-wrap:wrap;gap:6px}
.ain{padding:12px 14px;border-top:1px solid var(--line)}
.am{padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.45;max-width:94%}
.am.u{align-self:flex-end;background:var(--gold);color:#1a1f47}.am.c{background:var(--panel2);align-self:flex-start}
.am.t{align-self:flex-start;color:var(--gold);font-size:12.5px;padding:2px 4px}.am.r{align-self:flex-start;font-size:12px;color:#9fe0bd;padding:2px 4px}.am.r.bad{color:#ff9aa1}.am.d{align-self:center;color:var(--muted);font-size:11.5px}
.am.c p{margin:2px 0}
.clip.flash{animation:flashclip 2.6s ease-out}
@keyframes flashclip{0%{box-shadow:0 0 0 3px var(--gold),0 0 26px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
#liveov{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:10px}
.lv-cap{position:absolute;left:5%;right:5%;bottom:24%;text-align:center;font:400 26px Impact,Arial Black,sans-serif;color:#f8c880;-webkit-text-stroke:5px #202860;paint-order:stroke fill;letter-spacing:.5px}
.lv-ban{position:absolute;left:0;top:26%;background:rgba(20,26,64,.92);color:#fff;border-left:6px solid var(--gold);padding:4px 12px;font:400 17px Impact,Arial Black,sans-serif}
.lv-tag{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:rgba(20,26,64,.92);border:2px solid var(--gold);color:#fff;border-radius:99px;padding:3px 12px;font:600 12px sans-serif;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.lv-card{position:absolute;inset:0;background:linear-gradient(160deg,#141a40,#2a2470);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;padding:14px}
.lv-card b{font:400 34px Impact,sans-serif;color:var(--gold)}.lv-card span{font:400 22px Impact,sans-serif}.lv-card i{font-size:11px;color:var(--muted);font-style:normal}
kbd{font:600 10px sans-serif;opacity:.65;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:5px}
.tlbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px;padding:7px 10px;background:#0d1233;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0}
.tlbar button{padding:5px 10px;font-size:12.5px}.tlbar button.on{border-color:var(--gold);color:var(--gold)}.tlbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}.tlbar input[type=range]{width:110px}
.tlbox{margin-top:0!important;border-radius:0 0 12px 12px!important}
.trk.cap,.trk.txt{height:26px}.trk.vid{height:64px}
.clip.c{top:3px;bottom:3px;background:#1d4f8c;font-size:10.5px;padding:3px 5px;cursor:grab;border-width:1px;border-radius:5px;text-overflow:ellipsis}
.clip.c.edited{background:#7a5a14}.clip.c.sel{border-color:var(--gold);border-width:2px}
.jn{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#0b0f2c;border:1.5px solid #6d7bd6;color:#cbd3ff;font-size:13px;line-height:19px;text-align:center;cursor:pointer;z-index:6;opacity:0;transition:opacity .12s}
.trk.vid:hover .jn,.jn.set{opacity:1}.jn.set{background:var(--gold);color:#1a1440;border-color:var(--gold)}.tlinner.dragging .jn{display:none}
.snapline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed #ffd76a;z-index:7;pointer-events:none;display:none}
.skimline{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);z-index:6;pointer-events:none;display:none}
.playbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}.playbar .pl{border-radius:99px;padding:6px 18px;font-weight:700}
.tcw{text-align:center;margin-top:4px}.tc{font:600 12.5px ui-monospace,SFMono-Regular,monospace;color:var(--muted)}
.pop{position:fixed;z-index:60;background:#12184a;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 34px rgba(0,0,0,.55);min-width:210px}
.pop a{display:block;padding:7px 10px;border-radius:7px;color:var(--text);cursor:pointer;font-size:13px}.pop a:hover{background:#1f2870}.pop a.dg{color:#ff9aa1}
.lv-cap{pointer-events:auto;cursor:ns-resize;font-family:Impact,"Arial Black",sans-serif;font-weight:400;paint-order:stroke fill;position:absolute;left:4%;right:4%;text-align:center;line-height:1.1;text-transform:none}
.lv-cap:hover{outline:1px dashed rgba(255,255,255,.5);outline-offset:3px}
.lv-capin{width:100%;font:inherit;text-align:center;background:rgba(10,14,40,.85);color:#fff;border:2px solid var(--gold);border-radius:8px;padding:2px 4px;-webkit-text-stroke:0}
.capctl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.cglist{margin-top:6px}.cgrow{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:8px}.cgrow.act{background:rgba(248,200,128,.14)}
.cgrow .tm{width:42px;flex:none;font-size:11px;color:var(--muted);cursor:pointer}.cgrow input{flex:1;min-width:0}.cgrow button.sm{padding:3px 8px}
.clip.c .hl,.clip.c .hr{width:min(6px,28%);background:rgba(255,255,255,.35)}.clip.c span{pointer-events:none;position:relative;z-index:2}

/* ===== HYL's Studio skin: light, quiet, Apple-like. Follows the system light/dark setting. The editor's timeline stays dark, like Final Cut. ===== */
:root{--bg:#f5f5f7;--panel:#ffffff;--panel2:#ececf0;--line:rgba(0,0,0,.10);--text:#1d1d1f;--muted:#6e6e73;--gold:#0071e3;--blue:#0071e3;--red:#d70015;--ok:#1d8f4e;--r:18px;--input:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06);--nav:rgba(245,245,247,.72);--soft:rgba(0,113,227,.09)}
@media (prefers-color-scheme: dark){:root{--bg:#000;--panel:#1c1c1e;--panel2:#2c2c2e;--line:rgba(255,255,255,.12);--text:#f5f5f7;--muted:#98989d;--gold:#2997ff;--blue:#2997ff;--red:#ff453a;--ok:#32d74b;--input:#2c2c2e;--shadow:none;--nav:rgba(0,0,0,.72);--soft:rgba(41,151,255,.16)}}
html,body{font:15px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
header.top{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--line);padding:10px 28px}
header.top .brand{color:var(--text);font-weight:600;font-size:17px;letter-spacing:-.02em;gap:6px}
header.top .brand .mark{font-weight:800;background:linear-gradient(135deg,#0071e3,#7a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top .crumb{color:var(--muted);font-size:14px}
main{max-width:1480px;padding:28px 28px 60px}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}h2{font-size:22px;font-weight:700;letter-spacing:-.02em}h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){.card{border-color:var(--line)}}
button,.btn{background:var(--panel2);color:var(--text);border:0;border-radius:980px;padding:8px 16px;font-weight:500;transition:background .15s,transform .05s,opacity .15s}
button:hover,.btn:hover{background:color-mix(in srgb,var(--panel2) 82%,var(--text));border-color:transparent}
button:active{transform:scale(.98)}
button.primary,.btn.primary{background:var(--gold);color:#fff;font-weight:600;border:0}
button.primary:hover,.btn.primary:hover{background:color-mix(in srgb,var(--gold) 88%,#000)}
button.danger{background:transparent;color:var(--red);border:0}button.danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}
button.sm{padding:4px 12px;font-size:13px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 40%,transparent);outline-offset:1px}
input,select,textarea{background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 11px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent);outline:0}
input[type=range]{padding:0;background:transparent;accent-color:var(--gold)}input[type=checkbox]{accent-color:var(--gold)}
label{color:var(--muted);font-size:12.5px}

<body>
<header class="top">
  <a class="brand" href="#/"><span class="mark">HYL's</span><span>Studio</span></a>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <span id="topright"></span>
</header>
<main id="app"></main>
<div id="toast"></div>
<div id="modalroot"></div>

<script>
"use strict";
/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
  return (r.headers.get("content-type") || "").includes("json") ? r.json() : r;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
const fmtT = s => { s = Math.max(0, s || 0); return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); };
const fmtT1 = s => { s = Math.max(0, s || 0); return Math.floor(s / 60) + ":" + (s % 60).toFixed(1).padStart(4, "0"); };
const fmtSize = b => b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : b > 1e6 ? Math.round(b / 1e6) + " MB" : Math.round((b || 0) / 1e3) + " KB";
const ago = ts => { const d = (Date.now() / 1000 - ts); return d < 90 ? "just now" : d < 5400 ? Math.round(d / 60) + " min ago" : d < 129600 ? Math.round(d / 3600) + " h ago" : new Date(ts * 1000).toLocaleDateString(); };
function toast(msg, err) { const d = document.createElement("div"); if (err) d.className = "err"; d.textContent = msg; $("#toast").appendChild(d); setTimeout(() => d.remove(), err ? 6000 : 3200); }
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function md(src) {
  const lines = String(src || "").split("\n"); let out = "", ul = false;
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
  for (const l of lines) {
    if (/^\s*[-*] /.test(l)) { if (!ul) { out += "<ul>"; ul = true; } out += "<li>" + inl(l.replace(/^\s*[-*] /, "")) + "</li>"; continue; }
    if (ul) { out += "</ul>"; ul = false; }
    if (/^### /.test(l)) out += "<h3>" + inl(l.slice(4)) + "</h3>";
    else if (/^#{1,2} /.test(l)) out += "<h2>" + inl(l.replace(/^#+ /, "")) + "</h2>";
    else if (l.trim()) out += "<p>" + inl(l) + "</p>";
  }
  return out + (ul ? "</ul>" : "");
}

/* ---------- state ---------- */
const S = { undo: [], redo: [], lastSaved: null, pend: false, pmode: null, pps: 8, t: 0, peaks: {}, selType: "seg", ptab: "inspector", slug: null, tab: "overview", info: null, project: null, dur: null, plan: null, words: null, sel: null, saveState: "saved", saveMsg: "", selW: { a: null, b: null }, status: null, hist: [], view: "final", fz: null, vtSel: null };
let saveTimer = null, pollTimer = null;

/* ---------- router ---------- */
window.addEventListener("hashchange", route);
async function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  document.body.dataset.route = parts[0] || "home"; if (parts[0] !== "p") document.body.dataset.tab = "";
  if (parts[0] !== "p") { if (AS.open) app.assistToggle(); document.querySelectorAll("#assist,#assistfab").forEach(e => e.remove()); }
  closeModal();
  try {
    if (parts[0] === "p" && parts[1]) await openProject(parts[1], parts[2] || "overview");
    else await renderHome();
  } catch (e) { $("#app").innerHTML = `<div class="card"><h2>Something went wrong</h2><p>${esc(e.message)}</p><a class="btn" href="#/">Back to library</a></div>`; }
}

/* ---------- HOME ---------- */
const H = { inbox: [], projects: [], showAll: false, q: "", mode: "link", cfg: null };
async function renderHome() {
  S.slug = null; $("#crumb").textContent = ""; $("#topright").innerHTML = "";
  [H.projects, H.inbox, H.cfg] = await Promise.all([api("/api/projects"), api("/api/inbox"), api("/api/config")]);
  drawHome();
}
function groupBySeries(list) {
  const groups = {}; const solo = [];
  list.forEach(p => { if (p.series) { (groups[p.series] = groups[p.series] || { label: p.series_label || p.series, items: [] }).items.push(p); } else solo.push(p); });
  const arr = Object.entries(groups).map(([key, g]) => ({ key, label: g.label, items: g.items }));
  arr.sort((a, b) => b.items.length - a.items.length);
  return { groups: arr, solo };
}
function seriesSection(list, cardFn, emptyMsg) {
  if (!list.length) return `<p class="muted">${emptyMsg}</p>`;
  const { groups, solo } = groupBySeries(list);
  const groupHTML = groups.map(g => `<details class="pgrp" open style="border-top:0;margin-bottom:6px"><summary><b>${esc(g.label)}</b> <span class="small muted">· ${g.items.length} video${g.items.length === 1 ? "" : "s"}</span></summary><div class="grid g3" style="margin-top:10px">${g.items.map(cardFn).join("")}</div></details>`).join("");
  const soloHTML = solo.length ? `<div class="grid g3">${solo.map(cardFn).join("")}</div>` : "";
  return groupHTML + soloHTML;
}
function drawHome() {
  const fin = H.projects.filter(p => p.final);
  const q = H.q.toLowerCase();
  const inbox = H.inbox.filter(r => !q || (r.name + " " + r.folder).toLowerCase().includes(q));
  const shown = H.showAll || q ? inbox : inbox.slice(0, 10);
  const stageChip = p => ({ video: ["bad", "Video missing"], transcript: ["todo", "Needs transcript"], script: ["todo", "Needs script"], edit: ["todo", "Needs edit"], render: ["todo", "Ready to render"], done: ["done", "Rendered"] })[p.stage];
  $("#app").innerHTML = `
  <h1>Your videos</h1><p class="muted">Add a video, review the script, edit, and preview the result here. Everything stays on this Mac.</p>
  <div class="grid g2" style="margin-top:14px">
    <div class="card">
      <h2>1. Add a video</h2>
      <div class="drop" id="drop"><b>Drop videos or a whole folder here</b><div class="muted small">Several videos become one project you edit together. mp4, mov, m4v, mkv. Big files are fine.</div></div>
      <div class="row" style="margin-top:8px"><button class="sm" onclick="$('#pick').click()">Choose videos…</button><button class="sm" onclick="$('#pickdir').click()">Choose a folder…</button></div>
      <input type="file" id="pick" accept="video/*,.mkv" multiple style="display:none"><input type="file" id="pickdir" webkitdirectory style="display:none">
      <div class="bar" id="upbar" style="display:none"><i></i></div><div class="small muted" id="uptxt"></div>
      <label>Or link a file or a folder already on this Mac (nothing is copied)</label>
      <div class="row"><input id="linkpath" placeholder="/Users/you/Movies/clip.mp4 or a folder" style="flex:1"><button onclick="app.linkPath()">Start project</button></div>
      <div class="small muted" style="margin-top:10px">From your iPhone: save the video into the iCloud Drive folder listed on the right. It appears here in a minute or two.</div>
    </div>
    <div class="card">
      <div class="row"><h2 style="margin:0">Phone transfers &amp; inbox</h2><span class="spacer"></span><button class="sm" onclick="app.editFolders()">Folders</button><button class="sm" onclick="app.refreshInbox()">Refresh</button></div>
      <div class="row" style="margin:8px 0"><input id="inq" placeholder="Search by name or folder" value="${esc(H.q)}" style="flex:1" oninput="app.inboxSearch(this.value)">
        <select id="mode" style="width:auto" onchange="H.mode=this.value"><option value="link" ${H.mode === "link" ? "selected" : ""}>Link (don't copy)</option><option value="copy" ${H.mode === "copy" ? "selected" : ""}>Copy into Studio</option></select></div>
      ${(() => { const g = {}; inbox.filter(r => !r.cloud_only && !r.used).forEach(r => { const k = r.base + "/" + r.folder; (g[k] = g[k] || { name: (r.folder && r.folder !== "." ? r.folder.split("/").pop() : r.base), rows: [] }).rows.push(r); }); H.folders = g;
        const list = Object.entries(g).filter(([k, v]) => v.rows.length >= 2).sort((a, b) => Math.max(...b[1].rows.map(r => r.mtime)) - Math.max(...a[1].rows.map(r => r.mtime))).slice(0, 8);
        return list.length ? `<div class="small muted" style="margin:8px 0 4px">Folders you can edit together</div>${list.map(([k, v]) => `<div class="li row" style="justify-content:space-between;padding:6px 2px"><div style="min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b>${esc(v.name)}</b></div><div class="small muted">${v.rows.length} videos · ${fmtSize(v.rows.reduce((n, r) => n + r.size, 0))}</div></div><button class="sm primary" onclick="app.startFromFolder(${JSON.stringify(k).replace(/"/g, "&quot;")})">Edit together</button></div>`).join("")}<div class="small muted" style="margin:10px 0 4px">Single videos</div>` : ""; })()}
      <div style="max-height:250px;overflow:auto">${shown.map(r => `<div class="li row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 2px">
        <div style="min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</div><div class="small muted">${esc(r.base)}${r.folder && r.folder !== "." ? " / " + esc(r.folder) : ""} · ${r.cloud_only ? "still in iCloud (not downloaded)" : fmtSize(r.size) + " · " + ago(r.mtime)}</div></div>
        ${r.used ? '<span class="chip done">in a project</span>' : r.cloud_only ? '<span class="chip">waiting</span>' : `<button class="sm" onclick="app.startFromInbox(${H.inbox.indexOf(r)})">Start project</button>`}</div>`).join("") || '<div class="muted small">Nothing here yet.</div>'}</div>
      ${!H.showAll && !q && inbox.length > 10 ? `<button class="sm" style="margin-top:8px" onclick="H.showAll=true;drawHome()">Show all ${inbox.length}</button>` : ""}
    </div>
  </div>

const VID_RE = /\.(mp4|mov|m4v|mkv|avi)$/i;
async function entriesToFiles(entries) {
  const files = []; let label = "";

    if (en.isFile) { await new Promise(res => en.file(f => { if (VID_RE.test(f.name) && !f.name.startsWith(".")) files.push(f); res(); }, res)); }
    else if (en.isDirectory && depth < 3) { if (!label && depth === 0) label = en.name; const rd = en.createReader(); let batch; do { batch = await new Promise(res => rd.readEntries(res, () => res([]))); for (const c of batch) await walk(c, depth + 1); } while (batch.length); }
  };
  for (const en of entries) await walk(en, 0);
  return { files, label };
}
function putFile(file, folder, onprog) {
  return new Promise((ok, no) => { const x = new XMLHttpRequest(); x.open("PUT", "/api/upload?name=" + encodeURIComponent(file.name) + (folder ? "&folder=" + encodeURIComponent(folder) : ""));

    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} x.status === 200 ? ok(j) : no(new Error(j.error || "Upload failed")); }; x.onerror = () => no(new Error("Upload failed")); x.send(file); });
}

    const bar = $("#tbbar"), txt = $("#tbtxt"), btn = $("#tbrender"); if (bar) { bar.style.display = run ? "" : "none"; bar.firstChild.style.width = pct + "%"; txt.textContent = what || (st.mine && st.ok === false ? "Render failed: see the Preview tab" : ""); btn.disabled = st.running; }
  }

}

/* ---------- live sync with the server (Claude's edits appear as they happen) ---------- */
async function pullProject(quiet, force) {

  if (JSON.stringify(np) === JSON.stringify(S.project)) { S.rev = rev; S.lastSaved = clone(np); return; }   // same content, only the revision moved
  const before = Object.fromEntries((S.project.segments || []).map(s => [s.id, JSON.stringify(s)])); const changed = [];
  np.segments.forEach(s => { if (before[s.id] !== JSON.stringify(s)) changed.push(s.id); });
  const tracksChanged = JSON.stringify((S.project.audio || {}).tracks || []) !== JSON.stringify((np.audio || {}).tracks || []);
  S.undo.push(clone(S.project)); S.redo = []; S.project = np; S.rev = rev; S.lastSaved = clone(np); S.pend = false;   // changes made elsewhere (Claude) can be undone too

}
